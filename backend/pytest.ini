[pytest]
# `test`, never `dev`: dev inherits DATABASE_URL from .env, which on every
# machine here points at the shared Supabase instance the deployed app uses.
# Running the suite under dev creates a test database on production. See
# config/settings/test.py.
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
testpaths = apps
addopts =
    --strict-markers
    --disable-warnings
    -ra
markers =
    ml: requires the heavy CV stack from requirements/ml.txt (PaddleOCR/DeepFace)
    external: requires a real third-party API key and network access
