# -Xmx8G reserved 8GB for the Gradle daemon alone. On any machine with 16GB
# total RAM (i.e. most laptops), that starves Android Studio + the emulator +
# Windows itself and causes the whole PC to thrash/swap during the first
# build - this is a common cause of a build that "looks frozen" for hours.
# 3G is enough for this project's size; raise it only if you've confirmed
# you have 24GB+ RAM free to spare.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# --- Build performance (does not affect first-run download time, but makes
# every build after that dramatically faster) ---------------------------
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
# Watches the filesystem instead of rescanning it every build.
org.gradle.vfs.watch=true

# Kotlin incremental compilation is OFF, deliberately.
#
# It stores every source path *relative to* the module's build directory. This
# project lives on D: but the pub cache holding the plugin sources lives on
# C:\Users\<user>\AppData\Local\Pub\Cache, and Windows has no way to express a
# relative path between two drive roots. Kotlin therefore throws
#   IllegalArgumentException: this and base files have different roots
# while closing its caches, which surfaces as
#   "Could not close incremental caches in ...\caches-jvm\jvm\kotlin"
# and fails compileDebugKotlin for every plugin (device_info_plus,
# image_picker_android, shared_preferences_android, mobile_scanner, ...).
#
# Turning it off costs this project almost nothing: the only first-party Kotlin
# is MainActivity.kt. All other Kotlin belongs to plugins, whose sources never
# change between builds, so Gradle's own up-to-date checks and the build cache
# already skip those tasks entirely on warm builds.
#
# The alternative fix is to put the pub cache on the same drive as the project
# (set a PUB_CACHE env var pointing at D:\), which would let this be re-enabled.
kotlin.incremental=false

# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
