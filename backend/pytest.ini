[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests.py test_*.py *_tests.py
testpaths = apps
addopts =
    --strict-markers
    --disable-warnings
    -ra
markers =
    ml: requires the heavy CV stack from requirements/ml.txt (PaddleOCR/DeepFace)
    external: requires a real third-party API key and network access
