# Render deployment blueprint (free tier).
#
# Free plan reality — see docs/free-tier-constraints.md:
#   * sleeps after 15 minutes idle, ~50 s cold start
#   * 512 MB RAM: the PaddleOCR/DeepFace stack does NOT fit here
#   * 750 instance-hours/month account-wide, so keep this to ONE service
#
# Secrets are marked sync:false and must be entered in the Render dashboard;
# they are never committed to the repository.

services:
  - type: web
    name: sathify-api
    runtime: python
    plan: free
    region: singapore # closest free region to India
    branch: main
    rootDir: backend

    buildCommand: |
      pip install -r requirements/prod.txt
      python manage.py collectstatic --noinput
      python manage.py migrate

    # Single worker, restricted threads: 512 MB does not stretch further.
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 120

    healthCheckPath: /health/

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DJANGO_SECRET_KEY
        generateValue: true # Render generates and stores a strong key
      - key: DJANGO_DEBUG
        value: "False"

      # --- Supabase: paste the SESSION POOLER URI (port 6543) ----------------
      - key: DATABASE_URL
        sync: false

      # --- Supabase Storage (media must not touch Render's ephemeral disk) ---
      - key: SUPABASE_STORAGE_BUCKET
        value: sathify-media
      - key: SUPABASE_STORAGE_ENDPOINT
        sync: false
      - key: SUPABASE_STORAGE_ACCESS_KEY
        sync: false
      - key: SUPABASE_STORAGE_SECRET_KEY
        sync: false

      # --- AI layer: four free tiers, tried in order ------------------------
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false

      # --- Payments (test mode) ---------------------------------------------
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_TEST_MODE
        value: "True"

      # --- SMS: Module 1.4 OTP delivery, Module 10.2 notification fallback ---
      # A deployed server CANNOT REGISTER ANYBODY without these. There is no
      # terminal to print a code to, and codes are deliberately not written to
      # the logs — an OTP in a log file is a credential handed to everyone with
      # dashboard access. With SMS off, sign-up honestly returns 503 rather
      # than claiming to have sent something.
      #
      # ENABLED and API_KEY are sync:false so the dashboard owns them and a
      # blueprint re-sync cannot silently switch delivery off.
      #
      # The field names below are shaped for Fast2SMS. For MSG91 use
      # AUTH_HEADER=authkey and TO_FIELD=mobiles. See backend/.env.example,
      # and read the DLT note there before pointing this at your own sender id.
      - key: SMS_ENABLED
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: SMS_ENDPOINT
        value: https://www.fast2sms.com/dev/bulkV2
      - key: SMS_SENDER_ID
        value: SATHFY
      - key: SMS_TO_FIELD
        value: numbers
      - key: SMS_MESSAGE_FIELD
        value: message
      - key: SMS_AUTH_HEADER
        value: authorization
      # Empty: Fast2SMS wants the bare key, and a stray "Bearer" is a 401.
      - key: SMS_AUTH_SCHEME
        value: ""
      - key: SMS_EXTRA_PARAMS
        value: '{"route":"q"}'
