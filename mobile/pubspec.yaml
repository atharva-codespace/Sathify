name: sathify
description: Sathify — Smart Society Domestic Workforce Management System.
publish_to: "none"
version: 0.1.0+1

# Floor is 3.27, not 3.24, and the difference is load-bearing. Three APIs the
# codebase uses arrived in that release: Color.withValues (which replaced the
# now-deprecated withOpacity and avoids its precision loss in the wide-gamut
# colour model), CardThemeData, and the ColorScheme.surfaceContainer* roles.
# Declaring 3.24 while using them would let a 3.24 toolchain resolve the
# dependency graph happily and then fail to compile.
environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

# -----------------------------------------------------------------------------
# Dependencies are grouped by the module that introduced them, so a team member
# owning one module can see at a glance what they are responsible for.
#
# Every package here is free and open source. Firebase and Razorpay are used
# only through their free/test tiers.
# -----------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # multilingual UI is MVP scope, not future scope
    sdk: flutter

  # --- State management & navigation ----------------------------------------
  # Riverpod over Bloc: less boilerplate per feature, and its providers are
  # override-able in tests, which matters with four people writing tests.
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2 # declarative routing + per-role route guards

  # --- Networking (all modules) ---------------------------------------------
  dio: ^5.7.0 # interceptors give us JWT refresh in one place
  connectivity_plus: ^6.1.0 # drives offline-first behaviour (Module 13)

  # --- Local storage ---------------------------------------------------------
  flutter_secure_storage: ^9.2.2 # JWTs go in the Keystore, never SharedPreferences
  shared_preferences: ^2.3.3 # non-sensitive prefs (language, onboarding seen)
  sqflite: ^2.4.1 # Module 13.1 offline queue + cached booking list
  path: ^1.9.0

  # --- Config ----------------------------------------------------------------
  flutter_dotenv: ^5.2.1 # reads .env; keeps the API base URL out of source
  device_info_plus: ^11.2.0 # device identity for session management (Module 1.5)

  # --- Module 3: Worker onboarding & KYC ------------------------------------
  image_picker: ^1.1.2 # Aadhaar photo + profile photo capture/upload

  # --- Module 7: Attendance & gate verification ------------------------------
  mobile_scanner: ^6.0.2 # ML Kit/CameraX QR scanning, fully on-device
  qr_flutter: ^4.1.0 # renders the worker's own QR code
  uuid: ^4.5.1 # client-generated IDs so re-sync cannot duplicate
  geolocator: ^13.0.2 # resident GPS self check-in fallback (Module 13.3)

  # --- Module 8: Payments ----------------------------------------------------
  razorpay_flutter: ^1.3.7 # TEST MODE only

  # --- Module 10: Notifications ----------------------------------------------
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1 # renders pushes while app is foregrounded

  # --- Shared UI / formatting ------------------------------------------------
  # Pinned by flutter_localizations, not chosen freely: the Flutter SDK ships a
  # hard dependency on one intl version and pub will refuse to resolve anything
  # else. Bump this only when the SDK bumps its own pin.
  intl: ^0.20.2
  cached_network_image: ^3.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4 # no codegen needed, unlike mockito
  # build_runner + json_serializable + json_annotation were removed here:
  # nothing in lib/ has a @JsonSerializable class, a part '*.g.dart'
  # directive, or a generated file. They were pure dead weight - build_runner
  # pulls in `analyzer`, one of the largest and slowest-to-fetch/compile
  # packages in the pub ecosystem, for zero benefit. If a future module
  # needs JSON codegen, add all three back together.

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/translations/
